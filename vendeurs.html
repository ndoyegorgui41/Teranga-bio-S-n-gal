                <input type="text" id="recherche-vendeur" placeholder="Rechercher par nom ou description..." class="input-recherche">
            </div>
            <div class="filtres-container">
                <label for="filtre-zone">Filtrer par zone :</label>
                <select id="filtre-zone" class="select-filtre">
                    <option value="">Toutes les zones</option>
                </select>
            </div>
            <div id="compteur-resultats" class="compteur-resultats"></div>
        </section>
        <section id="liste-vendeurs">
            <!-- Liste générée par JS -->
        </section>
        <section id="mentions">
            <p><strong>Mention importante :</strong> Cette plateforme ne gère ni les paiements ni les livraisons. Toute transaction est à la responsabilité du vendeur et de l'acheteur.</p>
        </section>
